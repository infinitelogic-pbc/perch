[package]
name = "pdo"
version = "0.1.0"
edition = "2024"
description = "Portable Durable Objects: one SQLite file holding a Durable Object's code and data"
license = "Apache-2.0"

[[bin]]
name = "pdo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
deno_ast = { version = "0.53", features = ["transpiling"] }
deno_core = "0.413"
deno_error = "0.7"
fallible-streaming-iterator = "0.1"
hex = "0.4"
rusqlite = { version = "0.43", features = ["bundled", "session", "hooks", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.2.1"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v7"] }
