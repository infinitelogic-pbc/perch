<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do</title>
  <link rel="icon" href="/logo.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1><img src="/logo.png" alt="" width="20" height="20"> To-do</h1>
    <form id="add">
      <input name="title" placeholder="Add an item" autocomplete="off" required>
      <button>Add</button>
    </form>
    <ul id="list"></ul>
    <p class="foot"><a href="/stats">Stats</a> · served from a portable durable object</p>
  </main>
  <script>
    const list = document.getElementById("list");
    async function load() {
      const items = await (await fetch("/todos")).json();
      list.replaceChildren(...items.map((t) => {
        const li = document.createElement("li");
        const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: t.done === 1 });
        box.onchange = async () => {
          await fetch(`/todos/${t.id}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ done: box.checked }) });
          load();
        };
        const label = Object.assign(document.createElement("span"), { textContent: t.title });
        if (t.done) label.className = "done";
        li.append(box, label);
        return li;
      }));
    }
    document.getElementById("add").onsubmit = async (e) => {
      e.preventDefault();
      const input = e.target.title;
      await fetch("/todos", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ title: input.value }) });
      input.value = "";
      load();
    };
    load();
  </script>
</body>
</html>
