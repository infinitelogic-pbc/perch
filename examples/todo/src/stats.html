<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do stats</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>Stats</h1>
    <table>
      <tr><td>Total</td><td>{{total}}</td></tr>
      <tr><td>Open</td><td>{{open}}</td></tr>
      <tr><td>Done</td><td>{{done}}</td></tr>
      <tr><td>Last cleanup</td><td>{{lastCleanup}}</td></tr>
    </table>
    <p class="foot"><a href="/">Back</a> · rendered by fetch() from an imported template</p>
  </main>
</body>
</html>
